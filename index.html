 if(f.rc&&f.rc.it&&(dp||0)<4){const t=Array(9).fill(0),w=f.rc.w||f.rc.it.reduce((a,i)=>a+i.g,0);let ok=0;f.rc.it.forEach(i=>{const x=microOf(fo(i.f),(dp||0)+1);if(x){ok=1;x.forEach((v,j)=>t[j]+=v*i.g/100)}});return ok&&w>0?t.map(v=>v*100/w):null}return null}
const fibOf=f=>f?(f.rc?(f.rc.fi||0):((FZ[f.name]||[])[0]||0)):0;
function miRows(d){const day=S.meal.filter(m=>m.d==d),t=Array(9).fill(0);let kA=0,kD=0,fi=0,zu=0;
 day.forEach(m=>{const f=fo(m.f),l=ln(m),x=microOf(f);kA+=l.k;fi+=l.fi;zu+=l.zu;if(x){kD+=l.k;x.forEach((v,j)=>t[j]+=v*m.g/100)}});
 const L=miL(),kg=S.goal||2000;
 const rows=[{n:'Fibre',u:'g',r:25,v:fi,j:'fi'}].concat(L.map(([n,u,r],j)=>({n:n.replace(' (limite max)',''),u,r,v:t[j],j,lim:j==0}))).concat([{n:'Zuccheri',u:'g',r:Math.round(kg*.15/4),v:zu,j:'zu',lim:1}]);
 rows.forEach(x=>x.p=x.r?x.v/x.r*100:0);return{rows,kA,kD,n:day.length}}
const miFmt=v=>v>=100?Math.round(v).toLocaleString('it-IT'):v>=10?String(Math.round(v)):String(Math.round(v*10)/10).replace('.',',');
function miSug(x){const per=f=>x.j=='fi'?fibOf(f):(microOf(f)||[])[x.j]||0,lo=dShift(V.nd,-60),hist={};
 S.meal.filter(m=>m.d>=lo&&m.d<=V.nd).forEach(m=>{(hist[m.f]=hist[m.f]||[]).push(m.g)});
 const bad=/Birra|Vino|whey|Barretta|Maltodestrine|Acqua|Coca|Aranciata|Tè|Caffè/;
 const cand=f=>{if(!f||!(f.k>0)||bad.test(f.name))return null;const v=per(f);if(!(v>0))return null;const h=hist[f.id];let g=h?gR(med(h)):(PZ[f.name]?PZ[f.name][0][1]:100);if(!h)g=Math.min(g,Math.max(10,Math.round(150/f.k*100/5)*5));const a=v*g/100;if(a<x.r*.08)return null;return{f,g,a,d:a/(f.k*g/100),h:!!h}};
 const L=allF().map(cand).filter(Boolean).sort((a,b)=>(b.h-a.h)||(b.d-a.d));const top=[...L.filter(o=>o.h).slice(0,2)];L.filter(o=>!o.h).sort((a,b)=>b.d-a.d).forEach(o=>{if(top.length<2)top.push(o)});return top}
function miCard(){const D=miRows(V.nd),R=Math.round;if(!D.n)return '';
 const col=x=>x.lim?(x.p>100?'var(--bad)':'var(--c3)'):(x.p<80?'var(--hi)':'var(--c3)');
 let h=`<details id="dMi" ${V.o.dMi?'open':''}><summary>Micronutrienti del giorno</summary><p class="hint">ⓘ Percentuale dell’obiettivo giornaliero secondo i LARN (V revisione, SINU)${(S.pf||{}).sx?', in base a sesso ed età':''}. Fibre: almeno 25 g. Per sodio (2 g, obiettivo LARN e OMS) e zuccheri (15% delle kcal, LARN) è un limite da non superare. Il contenuto degli alimenti è un valore medio indicativo.</p>`;
 h+=D.rows.map(x=>`<div class="fmi" style="margin:6px 0"><span>${x.n}${x.lim?' <span class="hint">max</span>':''}</span><span class="fmb"><i style="width:${Math.min(100,x.p)}%;background:${col(x)}"></i></span><span><b style="${x.lim&&x.p>100?'color:var(--bad)':''}">${R(x.p)}%</b> <span class="hint">${miFmt(x.v)}/${miFmt(x.r)} ${x.u}</span></span></div>`).join('');
 h+=`<div class="fleg" style="margin:8px 0"><span><i style="background:var(--hi)"></i>sotto l’80%</span><span><i style="background:var(--c3)"></i>raggiunto</span><span><i style="background:var(--bad)"></i>oltre il limite</span></div>`;
 if(D.kA>0&&D.kD/D.kA<.95)h+=`<p class="hint">Dati disponibili per il ${R(D.kD/D.kA*100)}% delle calorie di oggi: alcuni alimenti personalizzati non hanno micronutrienti.</p>`;
 const low=D.rows.filter(x=>!x.lim&&x.p<80).sort((a,b)=>a.p-b.p).slice(0,2);
 if(low.length){h+=`<p class="hint" style="margin:10px 0 2px"><b>Per completare</b> · tocca per aggiungere ${MPA[V.mm]||'al pasto'}</p>`;low.forEach(x=>{const s=miSug(x);if(!s.length)return;h+=`<div style="margin:6px 0 0"><span style="font-weight:600">${x.n}</span><div class="sgl">${s.map(o=>`<button class="g" data-a="sga" data-i="${esc(o.f.id)}" data-g="${o.g}" aria-label="Aggiungi ${esc(o.f.name)} ${o.g} grammi, ${miFmt(o.a)} ${x.u} di ${x.n.toLowerCase()}">${esc(o.f.name)} ${o.g} g <span class="hint" style="margin:0">+${miFmt(o.a)} ${x.u}</span></button>`).join('')}</div></div>`})}
 return h+'</details>'}

function dragInit(e,U,idx,done,sc){
 if(e.button>0)return;e.preventDefault();const h=e.currentTarget;try{h.setPointerCapture(e.pointerId)}catch(x){}
 const g=U[idx];let py=e.clientY,raf=0;U=[...U];
 const rect=u=>{const a=u.els[0].getBoundingClientRect(),b=u.els[u.els.length-1].getBoundingClientRect();return{t:a.top,b:b.bottom}};
 const clr=()=>g.els.forEach(x=>x.style.transform='');
 clr();const grab=e.clientY-g.els[0].getBoundingClientRect().top;
 g.els.forEach(x=>x.classList.add('dg'));if(navigator.vibrate)navigator.vibrate(15);
 const step=()=>{
  let ci=U.indexOf(g),mv=1;
  while(mv){mv=0;ci=U.indexOf(g);
   const a=U[ci-1],b=U[ci+1];
   if(a){const r=rect(a);if(py<(r.t+r.b)/2){clr();a.els[0].before(...g.els);U.splice(ci,1);U.splice(ci-1,0,g);mv=1;continue}}
   if(b){const r=rect(b);if(py>(r.t+r.b)/2){clr();b.els[b.els.length-1].after(...g.els);U.splice(ci,1);U.splice(ci+1,0,g);mv=1}}}
  clr();const nt=g.els[0].getBoundingClientRect().top;g.els.forEach(x=>x.style.transform=`translateY(${py-grab-nt}px)`)};
 const loop=()=>{const H=innerHeight,zone=90;let d=0;const bt=sc?sc.getBoundingClientRect():{top:0,bottom:H};if(py<bt.top+zone)d=-Math.ceil((bt.top+zone-py)/6);else if(py>bt.bottom-zone)d=Math.ceil((py-(bt.bottom-zone))/6);if(d){if(sc)sc.scrollTop+=d;else scrollBy(0,d)}step();raf=requestAnimationFrame(loop)};
 const mv=ev=>{py=ev.clientY},end=ev=>{cancelAnimationFrame(raf);h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',end);h.removeEventListener('pointercancel',end);clr();g.els.forEach(x=>x.classList.remove('dg'));if(ev.type=='pointerup')done(U.map(u=>u.key));else render()};
 h.addEventListener('pointermove',mv);h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);raf=requestAnimationFrame(loop)}

 if(ed&&ok){V.ordu=bl.map(b=>({els:[b.bar,...b.e],key:b.k}));bl.forEach((b,i)=>{b.bar.addEventListener('pointerdown',e=>dragInit(e,V.ordu,i,ks=>{S.ord=S.ord||{};S.ord[K]=ks;save();render()}));b.bar.addEventListener('keydown',e=>{const d=e.key=='ArrowUp'?-1:e.key=='ArrowDown'?1:0;if(!d)return;e.preventDefault();const o=bl.map(x=>x.k),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];S.ord=S.ord||{};S.ord[K]=o;save();render();const nb=document.querySelectorAll('.ordbar')[j];if(nb)nb.focus()})})}

function wkS(d){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}
function wk(){
 const ws=[],x=new Date(wkS(today())+'T12:00:00');
 for(let i=0;i<6;i++){ws.unshift(x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()));x.setDate(x.getDate()-7)}
 const gm={};S.ex.forEach(e=>gm[e.id]=grp(e));
 const rows={};
 S.log.forEach(l=>{if(l.d<ws[0])return;const g=gm[l.e];if(!g)return;const w=wkS(l.d);if(!ws.includes(w))return;rows[g]=rows[g]||{};rows[g][w]=(rows[g][w]||0)+1});
 let h=`<h2 style="margin:18px 0 8px">Serie per gruppo a settimana</h2><p class="hint">Serie fatte per gruppo muscolare nelle ultime 6 settimane. Ogni colonna è un lunedì. L’ultima colonna è la settimana in corso; i trattini indicano i gruppi che stai trascurando.</p><div class="card">`;
 if(!Object.keys(rows).length)return h+'<p class="hint">Nessuna serie nelle ultime 6 settimane.</p></div>';
 const gs=[...groups(),...(rows['Senza gruppo']?['Senza gruppo']:[])];
 const cw=wkS(today()),lb=w=>(+w.slice(8))+'/'+(+w.slice(5,7));
 return h+`<div style="overflow-x:auto"><table class="wkt"><colgroup><col style="width:27%">${ws.map(()=>'<col>').join('')}</colgroup><tr><th></th>${ws.map(w=>`<th>${lb(w)}</th>`).join('')}</tr>`+gs.map(g=>`<tr><td>${esc(g)}</td>${ws.map(w=>{const n=(rows[g]||{})[w]||0;return n?`<td><span class="wkc" style="background:${mmCol(n)};color:${n<10?'#1c262b':'var(--card)'}">${n}</span></td>`:'<td><span class="wkc no">–</span></td>'}).join('')}</tr>`).join('')+`</table></div><div class="fleg" style="margin-top:8px"><span><i style="background:var(--hi)"></i>sotto 10</span><span><i style="background:var(--c3)"></i>10–20</span><span><i style="background:var(--acc)"></i>oltre 20</span></div></div>`;
}

function rcd(){
 const R=Math.round,e1=s=>rm1(s.kg,s.r);
 const LE=agg().le,rows=byG().flatMap(g=>g[1]).map(e=>{const s=LE[e.id]||[];if(!s.length)return null;if(e.t=='bw'){const m=s.reduce((a,b)=>(+b.r||0)>(+a.r||0)||((+b.r||0)==(+a.r||0)&&b.d>a.d)?b:a);return{n:e.name,m,bw:1}}const m=s.reduce((a,b)=>b.kg>a.kg||(b.kg==a.kg&&b.d>a.d)?b:a),r=s.reduce((a,b)=>e1(b)>e1(a)?b:a);return{n:e.name,m,rm:R(e1(r)*10)/10}}).filter(Boolean);
 let h=`<h2 style="margin:18px 0 8px">Record personali</h2><div class="card">`;
 if(!rows.length)return h+'<p class="hint">Registra qualche serie e qui troverai i tuoi massimali.</p></div>';
 return h+`<table><tr><th>Esercizio</th><th>Massimale</th><th>1RM stimato</th></tr>`+rows.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.bw?`${x.m.r} ripetizioni${x.m.f?' (max)':''}`:`${nI(x.m.kg)} kg × ${rS(x.m)}`}<br><span class="hint" style="margin:0">${fd(x.m.d)}/${x.m.d.slice(2,4)}</span></td><td>${x.bw?'<span class="hint" style="margin:0">corpo libero</span>':nI(x.rm)+' kg'}</td></tr>`).join('')+'</table><p class="hint">Per gli esercizi a corpo libero il record è il numero di ripetizioni. ⓘ 1RM stimato con la formula di Epley (1985); oltre 10 ripetizioni è la media con Brzycki (1993), perché la stima diventa meno affidabile.</p></div>';
}

function grMark(root,q){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];while(w.nextNode())L.push(w.currentNode);
 L.forEach(t=>{if(t.parentElement.closest('[hidden]'))return;const s=t.nodeValue,n=s.split('').map(c=>nrm(c)[0]||c).join(''),ix=[];let p=n.indexOf(q);while(p>=0){ix.push(p);p=n.indexOf(q,p+q.length)}if(!ix.length)return;
  const f=document.createDocumentFragment();let c=0;ix.forEach(i=>{f.append(s.slice(c,i));const m=document.createElement('mark');m.textContent=s.slice(i,i+q.length);f.append(m);c=i+q.length});f.append(s.slice(c));t.replaceWith(f)})}

 ds.forEach(d=>{const gd=d.querySelector('.gd');if(!gd)return;if(!gd._o)gd._o=gd.innerHTML;gd.innerHTML=gd._o;
  const items=[...gd.children].flatMap(c=>c.tagName=='UL'||c.tagName=='OL'?[...c.children]:[c]);items.forEach(i=>i.hidden=false);
  if(!q){d.hidden=false;d.open=!!V.o[d.id];return}
  const tm=nrm(d.querySelector('summary').textContent).includes(q);let hit=0;
  items.forEach(i=>{const m=nrm(i.textContent).includes(q);if(!tm)i.hidden=!m;if(m)hit++});
  const show=tm||hit>0;d.hidden=!show;if(show){d.open=true;n+=tm&&!hit?1:hit;grMark(gd,q)}else d.open=false});
 const e=$('#grn');if(e)e.textContent=q?(n?n+(n==1?' risultato':' risultati'):'Nessun risultato'):''}

 return `<h1>Guida</h1><p class="hint">Come usare Ghisa. Tocca un argomento per aprirlo o cerca una parola.</p><input id="grq" type="search" placeholder="Cerca nella guida (es. superserie, recupero)" value="${esc(V.grq||'')}" aria-label="Cerca nella guida" autocomplete="off"><p class="hint" id="grn" style="margin:4px 0 8px"></p>`+
 GR('start','Primi passi',`<p>Ghisa tiene traccia di allenamento, alimentazione e peso. Un buon ordine per iniziare:</p><ul><li><b>Esercizi</b>: tocca «Aggiungi dal catalogo» (73 esercizi in 9 gruppi: Petto, Schiena, Spalle, Bicipiti, Tricipiti, Quadricipiti, Femorali e glutei, Polpacci, Core) e spunta quelli che usi, oppure crea i tuoi assegnando un gruppo muscolare. Il catalogo compare anche in Schede, in «＋ Aggiungi esercizi».</li><li><b>Schede</b>: crea una scheda scegliendo gli esercizi e, se vuoi, le serie e le ripetizioni obiettivo.</li><li><b>Palestra</b>: scegli la scheda e registra le serie.</li><li><b>Dieta</b> e <b>Peso</b>: imposta gli obiettivi e inserisci pasti e misurazioni.</li></ul><p>La barra in basso passa da una sezione all’altra. Il pulsante “?” in alto a destra riapre questa guida.</p>`)+
 GR('oggi','Home',`<p><b>Pasti del piano</b>: «Segna …» copia nel diario il prossimo pasto del piano; se hai mangiato qualcosa di diverso tocca «Ho mangiato altro ›», che apre Dieta su «Aggiungi pasto» con quel pasto già scelto e la ricerca pronta.</p><p>È la schermata iniziale e mostra a colpo d’occhio:</p><ul><li><b>Oggi</b>: l’allenamento in programma (▶ Inizia, oppure Riprendi se c’è una seduta in corso), il cardio di oggi (Registra o Apri) e i pasti del piano, con un tocco per segnarli nel diario.</li><li><b>Questa settimana</b>: sette cerchi, uno per giorno, con la scheda prevista dal programma. ✓ allenamento fatto, tratteggio giorno saltato, puntino verde se hai fatto cardio.</li><li><b>Settimane di fila</b> con il programma rispettato (quando fai almeno tanti allenamenti quanti i giorni del programma; senza programma basta un allenamento), con le ultime otto settimane in barre.</li><li><b>Oggi a tavola</b>: anello delle calorie e anelli di proteine, carboidrati e grassi rispetto agli obiettivi.</li><li><b>Riepilogo settimanale</b>: allenamenti, volume, record, cardio, kcal medie e peso con il mini grafico degli ultimi pesi. Con «Scorsa» e «Altre» guardi le settimane passate.</li></ul><p>Altro nella Home:</p><ul><li><b>Storico giorni</b>: un calendario del mese con i pallini di cosa hai fatto (blu palestra, verde cardio, giallo pasti). Tocca un giorno per il riassunto e aprilo in Palestra, Dieta o Cardio per aggiungere o correggere dati dimenticati; con ‹ › cambi mese.</li></ul>`)+
 GR('allena','Palestra',`<ul><li><b>In seduta</b>: <b>⇄ Sostituisci</b> cambia l’esercizio (macchina occupata) solo per oggi o anche nella scheda; se un esercizio è <b>fermo da 3 sedute</b> l’app propone come sbloccarlo; sul primo esercizio pesante compare il <b>riscaldamento</b> (facoltativo); i tasti <b>0–4+</b> indicano quante ripetizioni avresti fatto ancora (RIR): con 3 o più su tutte le serie l’app propone di aumentare il carico, con 0 su più serie no. Con un programma pronto, ogni 5 settimane la Home propone una <b>settimana di scarico</b> (metà delle serie). Tutto regolabile in Palestra › Opzioni seduta.</li><li><b>Correggere una serie</b>: in «Registra a mano» tocca la serie (✏️) per cambiare carico e ripetizioni. Nello <b>Storico</b> ogni voce, segnata «a mano» o «seduta», ha <b>Modifica</b> (correggi o aggiungi serie ed esercizi, cambia la data) ed <b>Elimina</b> (con conferma e Annulla).</li><li>La parte principale è la <b>Modalità seduta</b> in alto. Per segnare serie senza seduta o in un altro giorno apri <b>Registra a mano</b> (lì trovi anche data e «Ripeti l’ultima seduta»).</li><li><b>Superserie</b>: si creano in Schede («Collega in superserie») o durante la seduta. Registri una serie per ciascuno con un solo pulsante e il recupero parte una volta sola.</li><li>In alto scegli l’<b>obiettivo settimanale</b> di allenamenti: la barra mostra quanti giorni ti sei allenato questa settimana (da lunedì). Lo stesso obiettivo conta per la striscia in Home.</li><li>Scegli la <b>data</b> e la <b>scheda</b> (oppure “Tutti gli esercizi”).</li><li>Per ogni esercizio inserisci i kg e le ripetizioni e tocca <b>Aggiungi</b>. I tasti − e + cambiano il carico di 1,25 kg.</li><li>Sotto l’esercizio vedi l’ultima sessione, il tuo record e, quando c’è, “Prova X kg”: compare se l’ultima volta hai completato tutte le serie e le ripetizioni obiettivo della scheda.</li><li>Il 🏆 segna le serie che eguagliano o superano il tuo massimo, e un avviso ti dice quando batti un record.</li><li>Il campo <b>Nota</b> serve per RPE, sensazioni o dolori e resta accanto alla serie.</li><li><b>Timer di recupero</b>: scegli la durata in alto. Parte quando aggiungi una serie e, a fine tempo, suona e vibra se il dispositivo lo permette.</li><li><b>Ripeti l’ultima seduta</b> (anche dalla Home) copia sulla data scelta le serie dell’ultimo allenamento della scheda, saltando gli esercizi che hanno già serie.</li><li>Per eliminare una serie tocca ×.</li></ul>`)+
 GR('seduta','Modalità seduta',`<p><b>Come si esegue</b>: sotto il nome dell’esercizio (anche in Registra a mano) c’è il riquadro «ⓘ Come si esegue». Per i 73 esercizi del catalogo contiene muscoli, posizione, esecuzione, errori comuni e respirazione; per gli altri puoi scrivere la tua guida. Con «✏️ Modifica» la personalizzi (e puoi ripristinare l’originale). «▶ Guarda come si fa su YouTube» apre la ricerca del video (serve internet).</p><p><b>Timer di recupero</b>: dopo ogni serie compare un cerchio in basso a sinistra con il tempo che manca. Toccalo per −15 s, +15 s, Riparti o ✕; tienilo premuto e trascinalo per spostarlo (la posizione viene ricordata). A fine recupero diventa verde con «VAI» e il telefono vibra.</p><p><b>Concludi sessione</b> (in alto a destra) chiude la seduta in qualsiasi momento: tocca una volta e poi «Conferma: concludi». Vedi il riepilogo (durata, serie, volume, record) e tocca Fine. Le serie sono salvate nello storico appena le aggiungi; la conclusione registra anche la seduta con la sua durata.</p><ul><li><b>Superserie</b>: se la scheda ne prevede una, i due esercizi compaiono sulla stessa schermata. Puoi anche abbinarne uno al volo dal riquadro «Superserie» sotto l’esercizio.</li><li>Tocca <b>▶ Modalità seduta</b> nella Home (scheda del giorno) o in Palestra: si apre una schermata a tutto schermo pensata per usarla in palestra, con il display che resta acceso se il telefono lo consente.</li><li>Vedi <b>un esercizio alla volta</b>, con obiettivo, ultima volta, record e le serie già fatte. Carico e ripetizioni sono precompilati e si cambiano con i tasti grandi − e + (1,25 kg e 1 ripetizione). “Aggiungi serie” registra e fa partire il timer di recupero.</li><li>Il menu a tendina in alto, con gli esercizi raggruppati per gruppo muscolare, permette di passare a un altro esercizio (con ✓ quelli già iniziati). Precedente e Successivo seguono lo stesso ordine per gruppo. In basso: <b>Precedente</b> e <b>Successivo</b>; all’ultimo esercizio compare <b>Termina seduta</b>.</li><li>Il riepilogo mostra durata, serie, esercizi, volume ed eventuali record. <b>Esci</b> chiude senza riepilogo: le serie restano comunque salvate.</li></ul>`)+
 GR('schede','Schede',`<p><b>Programmi pronti</b>: in cima a Schede tocca «Programmi pronti». Scegli un programma (filtri per giorni e corpo libero), guarda schede, settimana tipo e serie per muscolo, poi «Usa questo programma»: crea le schede, aggiunge dal catalogo gli esercizi che ti mancano e, se vuoi, compila il programma settimanale. Nei programmi <b>a rotazione</b> (es. Full body A/B, 5×5) scegli solo i giorni in cui ti alleni: in quei giorni la Home propone la scheda dopo l’ultima che hai completato, anche se salti un giorno. Se uno stesso esercizio è in più schede con obiettivi diversi, «Ultima volta» e i suggerimenti di carico guardano la stessa scheda.</p><p><b>Importa scheda da Excel</b>: in cima a Schede tocca «Importa scheda da Excel» e scegli un file .xlsx o .csv. L’app cerca le tabelle con la colonna «Esercizio» (più Rep/Serie, Peso, Recupero), riconosce «Giorno …» e «Settimana …», poi ti mostra un’anteprima: ✓ esercizi trovati, ≈ simili da confermare, ＋ nuovi da creare. Infine scegli i nomi delle schede e, se vuoi, i giorni della settimana. Il file viene letto solo sul telefono; il vecchio formato .xls va salvato prima come .xlsx.</p><p><b>MAX (cedimento)</b>: accanto alle ripetizioni c’è il tasto MAX. Nella scheda imposta come obiettivo «fino a cedimento» (es. 3×max); in Palestra, nelle superserie e nella modalità seduta segna la serie come portata a cedimento, e si attiva da solo quando l’obiettivo della scheda è max. Puoi scrivere anche quante ripetizioni hai fatto (es. «12 (max)»): servono per volume e grafici; senza numero la serie compare come «max» e non conta nel volume.</p><ul><li>Tocca un esercizio della scheda per aprirlo e scrivi il numero di <b>serie</b>: compare una riga per serie con <b>ripetizioni</b> (o MAX) e <b>carico</b> (kg), così puoi fare piramidi o serie diverse. Le righe nuove copiano la precedente; «Copia la prima serie in tutte» le rende uguali.</li><li>In Palestra e in Modalità seduta le serie previste sono in colonna: quella da fare è evidenziata con i campi già pronti; tocca «✓ Serie N fatta» (correggi prima i numeri se serve).</li><li><b>Superserie</b>: tra due esercizi vicini tocca «Collega in superserie» (fino a 3 esercizi). Vengono eseguiti insieme, una serie dell’uno e una dell’altro, con un solo recupero; «Scollega» li separa.</li><li>Dai un nome alla scheda, tocca «＋ Aggiungi esercizi» (cerca o filtra per gruppo, spunta quelli che vuoi; se manca puoi crearlo lì), riordinali con ▲▼ e indica serie e ripetizioni obiettivo e, se vuoi, il tempo di <b>recupero</b> in secondi (“rec s”). Di base è 120 secondi. Quel tempo vale per quell’esercizio e ha la precedenza sul timer generale; se svuoti il campo si usa il timer generale.</li><li>Le schede create stanno in <b>Schede palestra</b>. Da lì puoi usarle nell’allenamento, modificarle o eliminarle (tocca ×).</li><li><b>Programma settimanale</b>: assegna una scheda a ogni giorno, o lascia “Riposo / libero”.</li></ul>`)+
 GR('esercizi','Esercizi',`<p><b>Tipo di esercizio</b>: quando crei un esercizio, dopo il gruppo muscolare scegli <b>con sovraccarico</b> (il record è il peso caricato) o <b>a corpo libero</b> (il record è il numero di ripetizioni). Per gli esercizi già creati il tipo si cambia nell’elenco. Se fai trazioni o dip anche zavorrati, crea due esercizi, per esempio «Trazioni» a corpo libero e «Trazioni zavorrate» con sovraccarico. Negli esercizi a corpo libero il campo del carico non compare.</p><ul><li>Aggiungi un esercizio scrivendo il nome e un gruppo: puoi sceglierne uno proposto (Petto, Schiena, Spalle, Braccia, Gambe, Core) o inventare il tuo.</li><li>Nell’elenco gli esercizi sono divisi per gruppo. Da lì cambi il gruppo di un esercizio o lo elimini: l’eliminazione cancella anche tutte le sue serie.</li><li>In fondo trovi il <b>Backup</b> (vedi “Dati e backup”).</li></ul>`)+
 GR('grafici','Grafici',`<ul><li><b>Mappa muscolare</b>: quante serie fai per gruppo muscolare, a scelta come radar (con il confronto sulla media delle 4 settimane prima) o come silhouette. Tra 10 e 20 serie a settimana è l’intervallo indicato per crescere.</li><li><b>Per esercizio</b>: carico massimo, 1RM stimato o volume, con la data sull’asse orizzontale.</li><li><b>Volume totale</b>: somma di carico × ripetizioni, per tutti i gruppi o per uno solo.</li><li><b>Peso</b>, <b>media a 7 giorni</b> e <b>BMI</b>. Se hai impostato un peso obiettivo, compare come linea tratteggiata.</li><li><b>Serie per gruppo a settimana</b>: una tabella delle ultime 6 settimane. I trattini mostrano i gruppi che stai trascurando.</li><li><b>Misure corporee</b>: andamento di vita, petto, braccio, coscia, fianchi e polpaccio.</li><li><b>Record personali</b>: massimale e 1RM stimato di ogni esercizio.</li></ul><p>L’1RM è una stima (Epley; oltre 10 ripetizioni media con Brzycki), non un massimale testato.</p>`)+
 GR('dieta','Dieta',`<ul><li>In alto scegli la <b>data</b> del diario, anche con le frecce ‹ › per il giorno prima o dopo.</li><li>Il menu <b>Obiettivi</b> ha tre passi: <b>1</b> il tuo fabbisogno (sesso, età, attività; stima dalla formula di Mifflin-St Jeor e, quando ci sono abbastanza dati, dai tuoi pesi e pasti), <b>2</b> l’obiettivo calorico (Dimagrire, Mantenere, Aumentare o un tuo valore), <b>3</b> i macro in grammi. Le barre del riepilogo mostrano quanto manca e diventano rosse se superi l’obiettivo.</li><li><b>Aggiungere un alimento</b>: cerca per nome oppure apri una categoria (Proteine, Carboidrati, Grassi, Verdure, Bevande), tocca l’alimento, indica i grammi (o scegli una porzione, quando c’è) e il pasto, poi “Aggiungi al diario”. Gli alimenti usati di recente compaiono come scorciatoie.</li><li>“Copia i pasti del giorno prima” duplica il diario di ieri sulla data scelta.</li><li><b>Pasti salvati</b>: in ogni pasto del diario scrivi un nome e tocca Salva. Poi puoi riaggiungerlo con un tocco, modificarlo (nome, grammi, alimenti da togliere) o eliminarlo.</li><li><b>Alimenti personalizzati</b>: aggiungi i tuoi valori per 100 g e, se vuoi, scegli la categoria. Quelli creati compaiono nell’elenco di «Aggiungi pasto» con l’etichetta «personalizzato»: tocca ▾ per modificarli o eliminarli.</li><li>Il riepilogo mostra anche fibre e zuccheri, calcolati solo per gli alimenti che hanno questi dati: è una stima.</li><li>Più in basso trovi le calorie giornaliere nel tempo e la <b>media degli ultimi 7 giorni</b> rispetto ai tuoi obiettivi.</li><li><b>Ricette</b>: nel menu «Ricette» scegli gli ingredienti con il peso a crudo e scrivi il peso finale dopo la cottura (e, se vuoi, il peso di una porzione): l’app calcola i valori per 100 g e salva il piatto come alimento. Nella lista della spesa le ricette si scompongono negli ingredienti.</li><li><b>Copia un pasto</b>: in «Aggiungi pasto» tocca «Copia un pasto da un altro giorno», scegli giorno e pasto e copiali nel pasto selezionato.</li><li><b>Suggerimenti</b>: in «Aggiungi pasto» compaiono gli alimenti che mangi di solito in quel pasto (negli ultimi 30 giorni, almeno due volte), con la dose abituale. Un tocco aggiunge l’alimento; «Aggiungi tutto» registra il pasto tipico. All’apertura il pasto proposto segue l’ora del giorno.</li><li><b>Ricetta da testo</b>: nel menu «Ricette» tocca «+ Da testo o voce», incolla l’elenco degli ingredienti (es. «320 g pasta», «2 cucchiai di olio») e tocca «Riconosci». Le righe con ✓ sono riconosciute, quelle con ? o ✕ vanno controllate: scegli l’alimento dal menu o cercane un altro, e correggi i grammi. Cucchiai, tazze, fette e unità (es. «2 uova») vengono convertiti in grammi con valori medi. Indica le porzioni e salva, oppure apri la ricetta nell’editor. Con <b>Detta gli ingredienti</b> puoi elencarli a voce (es. «trecento grammi di pasta, una scatoletta di tonno, due cucchiai di olio»), poi tocca Fine: le righe vengono aggiunte al riquadro e riconosciute. La dettatura usa il riconoscimento vocale gratuito del browser (Chrome), serve il permesso del microfono e di solito la connessione; nell’anteprima di Claude non funziona.</li><li><b>Micronutrienti del giorno</b>: fibre, minerali e vitamine del diario in percentuale degli obiettivi LARN (sesso ed età dal Fabbisogno giornaliero). Sodio e zuccheri sono limiti. Sotto «Per completare» trovi alimenti, prima tra quelli che mangi già, che coprono ciò che manca: un tocco li aggiunge al pasto scelto.</li></ul><p>Tutti i menu della Dieta si aprono chiusi (tranne il tasto per scansionare il codice a barre, sempre in alto): tocca un titolo per aprirlo. Restano aperti finché non chiudi l’app. Il titolo di alcuni menu mostra già il dato principale (calorie del giorno, numero di alimenti).</p><p>I valori del database sono medi e indicativi: per i prodotti confezionati vale l’etichetta.</p>`)+
 GR('extra','Novità: tasto +, tema, riepilogo',`<ul><li>Il tasto <b>+</b> in basso a destra apre l’aggiunta rapida: peso di oggi, serie, seduta, pasto, cardio.</li><li>Se chiudi o ricarichi la pagina durante una <b>seduta</b>, al ritorno riprende da dove eri (entro 12 ore).</li><li>Il <b>tema</b> (Auto, Chiaro, Scuro) si sceglie nel menu laterale.</li><li>Il <b>riepilogo settimanale</b> in Home mostra allenamenti, volume, record, cardio, kcal medie e peso, per la settimana corrente o la scorsa.</li></ul>`)+
 GR('piano','Piano pasti e spesa',`<p><b>Piani pronti</b>: in cima a Piano pasti tocca «Piani pronti» e scegli tra 8 piani (4 onnivori, 2 vegetariani, 2 vegani). Le dosi vengono adattate al fabbisogno stimato in Obiettivi: le proteine in base al peso, le calorie restanti tra carboidrati e grassi; le verdure restano libere. Puoi scegliere Dimagrire, Mantenere o Massa, e 7 giorni diversi oppure 3 giornate a rotazione. Se poi cambi peso o obiettivo, tocca «Ricalcola dosi». Sono piani generici: per esigenze mediche serve un professionista.</p><p><b>Importa piano da Excel</b>: in cima a Piano pasti tocca «Importa piano da Excel» e scegli un file .xlsx o .csv con le colonne Pasto, Alimento e Grammi (Giorno e Note facoltative; «Tutti i giorni» vale per ogni giorno). Scegli da quale settimana inserirlo e se sostituire o aggiungere, poi controlla gli alimenti: ✓ trovati, ≈ simili, ＋ nuovi (per questi scrivi le kcal per 100 g o cerca un alimento esistente). Se il file ha gli obiettivi giornalieri puoi importare anche quelli.</p><ul><li><b>Settimane</b>: con ‹ › in alto passi da una settimana all’altra. Una settimana senza piano proprio usa quello dell’ultima settimana pianificata; se la modifichi, la modifica vale da lì in poi solo per quella settimana. «⧉ Copia questa settimana nelle prossime» la copia nelle settimane che scegli.</li><li><b>⧉ Copia pasto</b> (sul titolo di ogni pasto): copia quel pasto negli altri giorni, sostituendo o aggiungendo.</li><li>Nella tab <b>Piano pasti</b> scegli un giorno della settimana e componi i quattro pasti con un <b>preferito</b> (anche ×0,5, ×1,5, ×2) o con un <b>alimento</b> in grammi. Con <b>+ Da testo o voce</b> scrivi o detti più alimenti in una volta (es. «80 g fiocchi d’avena, una banana, 200 ml di latte»): l’app li riconosce come nelle ricette, controlli le righe con ? o ✕ e tocchi «Aggiungi». Vedi subito calorie e macro contro i tuoi obiettivi.</li><li><b>Copia in altri giorni</b> ripete un giorno su quelli che scegli. <b>Applica al diario</b> aggiunge i pasti al giorno corrispondente della settimana in corso.</li><li><b>Spesa</b>: somma gli alimenti di tutta la settimana o dei giorni scelti, divisi per categoria. Riso e pasta cotti sono convertiti in peso a crudo. Spunta quello che hai comprato; «Copia come testo» ti dà la lista da incollare.</li></ul>`)+
 GR('barcode','Codice a barre',`<ul><li>In <b>Dieta → Aggiungi pasto</b> tocca «Scansiona codice a barre» e inquadra il prodotto: se il codice è già tra i tuoi alimenti lo trovo subito, altrimenti lo cerco su <b>Open Food Facts</b> (serve internet) e ti mostro nome e valori per 100 g da controllare.</li><li>Se il prodotto non c’è o sei offline, scrivi i valori dall’etichetta: li collego al codice e dalla volta dopo basta scansionare, anche <b>senza rete</b>.</li><li>La lettura dalla fotocamera funziona solo nell’<b>app installata</b> (Chrome su Android); nell’anteprima dentro Claude puoi scrivere le cifre a mano. In alternativa scrivi il codice nella casella.</li><li>I valori di Open Food Facts li inseriscono gli utenti: confrontali con l’etichetta. Se calorie e macro non tornano ti avviso.</li><li>Dati © contributori di Open Food Facts, licenza ODbL (openfoodfacts.org).</li></ul>`)+
 GR('cardio','Cardio',`<p><b>Schede cardio</b>: in Cardio crei schede a blocchi (riscaldamento, lavoro, recupero, ripeti × N, defaticamento) con lo sforzo percepito, oppure circuiti a corpo libero (giri, lavoro, pausa, esercizi da Esercizi › Cardio). Le metti nel programma settimanale accanto alla scheda palestra e partono con il timer guidato. Con la progressione attiva, dopo 2 sedute facili o giuste l’app propone il passo successivo. Puoi anche aggiungere esercizi cardio a una scheda palestra: nel selettore usa i tasti Palestra e Cardio.</p><p><b>Programmi pronti</b>: in Cardio tocca «Programmi pronti»: 8 percorsi a settimane (Da zero a 5 km, Camminata attiva, Base aerobica, Cardio dopo i pesi, HIIT, Dai 5 ai 10 km, Bici, Nuoto o ellittica). Scegli i giorni (proposti quelli senza palestra) e l’attività. L’uscita del giorno compare in Home con ▶ Inizia: il timer a intervalli scandisce le fasi con vibrazione e suono e indica il ritmo giusto (test del parlato, sforzo su 10 e battiti indicativi dalla tua età). Alla fine la sessione si salva da sola; se è stata dura o incompleta, la prossima volta ripeti la stessa uscita. Il programma non va avanti se salti un giorno; con «Ripeti settimana» torni indietro.</p><ul><li>Gli <b>obiettivi macro</b> in Dieta si stimano da soli (peso, stile di vita scelto nel Fabbisogno e calorie); scrivendo un tuo valore lo sostituisci, svuotando il campo torna l’automatico.</li><li>Nell’elenco alimenti il tasto <b>▾</b> mostra il rapporto tra i macro e i micronutrienti (sodio, potassio, calcio, magnesio, ferro, zinco, vitamine C, B12 e D) per 100 g. Per ${Object.keys(MS).length} alimenti su 210 sono verificati su tabelle USDA o INRAN (la fonte è indicata nel pannello); gli altri sono stime non verificate. “n.d.” = dato non riportato dalla fonte.</li><li>In <b>Dieta</b> ogni alimento di un pasto ha il tasto <b>Modifica</b> (grammi e pasto) e ogni pasto ha “+ Aggiungi alimento”.</li><li>I <b>grafici</b> si aprono sugli ultimi 3 mesi; con 1M, 3M, 6M, Tutto o lo zoom cambi la vista.</li><li>Le <b>kcal</b> si calcolano da sole (attività, durata, distanza e peso); se hai un dato più preciso scrivilo nel campo e sostituisce la stima. Le stime nello storico hanno il simbolo ~.</li><li>Nello <b>Storico</b> tocca <b>Modifica</b> per cambiare data, attività, durata, km, kcal o note di una sessione.</li><li>In alto scegli l’<b>obiettivo settimanale</b> di sessioni cardio: la barra segue le sessioni di questa settimana e il dato compare anche in Home.</li><li>Nella tab <b>Cardio</b> scegli data e attività (corsa, camminata, bici…) e inserisci i minuti; distanza, calorie e note sono facoltative.</li><li>Se indichi sia minuti sia km l’app calcola il <b>ritmo</b> (minuti al km).</li><li>In alto vedi il riepilogo della settimana (da lunedì). I grafici (minuti o km per giorno, filtrabili per attività, e minuti a settimana) sono in Grafici › Cardio: il tasto «Vedi i grafici del cardio» ti porta lì.</li><li>Le sessioni di oggi compaiono anche nella Home. Per eliminarne una tocca ×.</li></ul>`)+

 GR('peso','Peso e misure',`<ul><li><b>Massa grassa</b>: serve l’altezza, il sesso (si imposta lì stesso) e le misure di <b>collo</b> e <b>vita</b> (per le donne anche i <b>fianchi</b>), in cm. L’app usa la formula della Marina USA: l’errore tipico è di 3–4 punti percentuali, quindi guarda soprattutto l’andamento nel tempo.</li><li>Inserisci l’altezza e, se vuoi, un peso obiettivo. Poi registra le misurazioni: se ne salvi due nello stesso giorno vale l’ultima.</li><li>Il <b>BMI</b> è calcolato dall’app (peso diviso altezza al quadrato). È un valore indicativo: non distingue massa muscolare e grasso.</li><li><b>Misure corporee</b>: scegli la data, compila quelle che vuoi (anche solo una) e salva. Se riusi la stessa data, le misure si aggiungono a quelle già presenti.</li></ul>`)+

const ANG=['Fronte','Lato','Retro'],fdy=d=>fd(d)+'/'+d.slice(2,4),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const pdb=()=>DBp||(DBp=new Promise((res,rej)=>{const r=indexedDB.open('ghisa-foto',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const pTx=(mode,f)=>pdb().then(d=>new Promise((res,rej)=>{const t=d.transaction('p',mode),s=t.objectStore('p'),q=f(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
const pAll=()=>pTx('readonly',s=>s.getAll()),pPut=o=>pTx('readwrite',s=>s.put(o)),pDel=id=>pTx('readwrite',s=>s.delete(id)),pClear=()=>pTx('readwrite',s=>s.clear());
function loadPh(){return pAll().then(a=>{PH=(a||[]).sort((x,y)=>x.d<y.d?-1:1);PHok=true}).catch(()=>{PHerr=true;PHok=true})}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.75))};im.onerror=()=>rej(new Error('img'));im.src=u})}

let cmD=false;
const cmX=e=>{const el=$('#cmp');if(!el)return;const r=el.getBoundingClientRect();setCmp(Math.max(0,Math.min(100,Math.round((e.clientX-r.left)/r.width*100))))};

function vfb(){
 let h=`<h2 style="margin:22px 0 8px">Foto di progresso</h2>`;
 if(PHerr)h+=`<div class="card"><p>In questo browser non è possibile salvare le foto.</p></div>`;
 h+=`<div class="card"><h2>Nuova foto</h2><p class="hint">Scegli data e posa, poi scatta o prendi una foto dalla galleria: viene ridimensionata e salvata solo su questo dispositivo. Fai sempre la stessa posa, con la stessa luce e alla stessa ora.</p><div class="row"><input type="date" id="pfd" value="${V.fd}" aria-label="Data"><select id="pfa" aria-label="Posa">${ANG.map(a=>`<option ${a==V.fa?'selected':''}>${a}</option>`).join('')}</select></div><div class="row" style="margin:0"><label class="bt" style="flex:1">Scatta foto<input type="file" id="pfc" accept="image/*" capture="environment" class="vh"></label><label class="bt bt2" style="flex:1">Dalla galleria<input type="file" id="pff" accept="image/*" class="vh"></label></div>${(()=>{const fatte=ANG.filter(a=>PH.some(p=>p.d==V.fd&&p.a==a));return fatte.length?`<p class="hint" style="margin:8px 0 0">Il ${fdy(V.fd)}: ${ANG.map(a=>a+(fatte.includes(a)?' ✓':'')).join(' · ')}</p>`:''})()}</div>`;

 }

 h+=`<h2 style="margin:18px 0 8px">Galleria${PH.length?' ('+PH.length+')':''}</h2>`;

function refClean(){const E=new Set(S.ex.map(e=>e.id)),SC=new Set(S.sch.map(x=>x.id)),F=new Set([...FB.map(f=>f.id),...S.food.map(f=>f.id)]);let n=0;
 if(S.rot){S.rot.sch=S.rot.sch.filter(i=>SC.has(i));if(!S.rot.sch.length){delete S.rot;n++}}Object.keys(S.pl||{}).forEach(k=>{if(S.pl[k]&&!(S.pl[k]=='rot'&&S.rot)&&!SC.has(S.pl[k])){delete S.pl[k];n++}});
 S.sch.forEach(x=>{const ex0=x.ex.length;x.ex=x.ex.filter(i=>E.has(i));n+=ex0-x.ex.length;['t','rt'].forEach(k=>{if(x[k])Object.keys(x[k]).forEach(i=>{if(!E.has(i)){delete x[k][i];n++}})});if(x.ss){const g0=JSON.stringify(x.ss);x.ss=x.ss.map(g=>g.filter(i=>E.has(i))).filter(g=>g.length>1);if(JSON.stringify(x.ss)!=g0)n++}});
 Object.keys(S.sp||{}).forEach(d=>{const g0=JSON.stringify(S.sp[d]);S.sp[d]=(S.sp[d]||[]).map(g=>g.filter(i=>E.has(i))).filter(g=>g.length>1);if(JSON.stringify(S.sp[d])!=g0)n++;if(!S.sp[d].length)delete S.sp[d]});
 Object.values(S.mpw||{}).flatMap(W=>Object.values(W||{})).forEach(D=>Object.keys(D||{}).forEach(m=>{const a0=D[m].length;D[m]=D[m].filter(x=>F.has(x.f));n+=a0-D[m].length}));
 (S.sm||[]).forEach(x=>{const a0=x.items.length;x.items=x.items.filter(it=>F.has(it.f));n+=a0-x.items.length});
 return n}

function xpExOf(o){const v=o.value;let e=S.ex.find(x=>x.id==v);if(!e){const t=o.textContent.replace(/^✓\s*/,'').replace(/^\d+\.\s*/,'').trim();e=S.ex.find(x=>x.name==t)}return e}
function xpTxt(sel){const o=sel.options[sel.selectedIndex];return o?o.textContent:''}
function xpEnh(root){(root||document).querySelectorAll(XPS).forEach(sel=>{if(sel.dataset.xp)return;sel.dataset.xp='1';const b=document.createElement('button');b.type='button';b.className='xpb';b.style.cssText=sel.style.cssText;b.setAttribute('aria-haspopup','dialog');b.setAttribute('aria-label',(sel.getAttribute('aria-label')||'Esercizio')+': '+xpTxt(sel));b.innerHTML='<span></span><i aria-hidden="true">▾</i>';b.firstChild.textContent=xpTxt(sel);b.addEventListener('click',()=>xpOpen(sel,b));sel.after(b);sel.hidden=true;sel.tabIndex=-1})}
function xpSecs(sel){const out=[],kids=[...sel.children],hasG=kids.some(k=>k.tagName=='OPTGROUP'),flat=[...sel.options];
 const it=o=>{const e=xpExOf(o);return{o,t:o.textContent,g:e?grp(e):'',v:o.value}};
 if(hasG){kids.forEach(k=>{if(k.tagName=='OPTGROUP')out.push({g:k.label,l:[...k.children].map(it)});else if(!k.hidden)out.push({g:'',l:[it(k)]})});return{out,side:false}}
 const L=flat.map(it),num=L.some(x=>/^(✓\s*)?\d+\.\s/.test(x.t));
 if(num||!L.some(x=>x.g))return{out:[{g:'',l:L}],side:num};
 const none=L.filter(x=>!x.v),gs=[];L.filter(x=>x.v).forEach(x=>{const k=x.g||'Senza gruppo';let o=gs.find(y=>y.g==k);if(!o)gs.push(o={g:k,l:[]});o.l.push(x)});
 gs.sort((a,b)=>(a.g=='Senza gruppo')-(b.g=='Senza gruppo')||a.g.localeCompare(b.g));if(none.length)gs.unshift({g:'',l:none});return{out:gs,side:false}}
function xpList(){const q=nrm($('#xpq')?$('#xpq').value:''),{sel}=XP,{out,side}=xpSecs(sel);let h='',n=0;
 out.forEach(sec=>{const l=sec.l.filter(x=>!q||nrm(x.t+' '+x.g).includes(q));if(!l.length)return;if(sec.g)h+=`<div class="xpg" role="presentation">${esc(sec.g)} · ${l.length}</div>`;
  l.forEach(x=>{n++;const on=x.v==sel.value;h+=`<button type="button" class="xpo${on?' on':''}" data-xv="${esc(x.v)}" role="option" aria-selected="${on}"><span>${esc(x.t)}</span>${side&&x.g?`<small>${esc(x.g)}</small>`:''}</button>`})});
 $('#xpl').innerHTML=n?h:'<p class="xpn">Nessun esercizio trovato.</p>'}
function xpOpen(sel,b){XP={sel,b};const p=$('#xp'),many=sel.options.length>8;
 p.innerHTML=`<div class="xps" role="dialog" aria-modal="true" aria-label="${esc(sel.getAttribute('aria-label')||'Esercizio')}"><div class="xph"><b>${esc(sel.getAttribute('aria-label')||'Esercizio')}</b><button class="g" data-xc="1">Chiudi</button></div>${many?'<input id="xpq" type="search" class="xpq" placeholder="Cerca esercizio" aria-label="Cerca esercizio" autocomplete="off">':''}<div class="xpl" id="xpl" role="listbox"></div></div>`;
 p.hidden=false;document.body.classList.add('xpo-on');xpList();const on=p.querySelector('.xpo.on');if(on){const l=$('#xpl');l.scrollTop=Math.max(0,on.offsetTop-l.offsetTop-80)}
 (on||p.querySelector('.xpo')||p.querySelector('[data-xc]')).focus({preventScroll:true})}
function xpClose(){const p=$('#xp');if(!p||p.hidden)return;p.hidden=true;p.innerHTML='';document.body.classList.remove('xpo-on');const b=XP&&XP.b;XP=null;if(b&&b.isConnected)b.focus({preventScroll:true})}
function xpPick(v){const {sel,b}=XP;xpClose();if(sel.value==v)return;sel.value=v;if(b&&b.isConnected){b.firstChild.textContent=xpTxt(sel);b.setAttribute('aria-label',(sel.getAttribute('aria-label')||'Esercizio')+': '+xpTxt(sel))}sel.dispatchEvent(new Event('change',{bubbles:true}))}
document.addEventListener('click',e=>{const p=$('#xp');if(!p||p.hidden)return;if(e.target==p||e.target.closest('[data-xc]')){xpClose();return}const o=e.target.closest('.xpo');if(o)xpPick(o.dataset.xv)},true);
document.addEventListener('input',e=>{if(e.target.id=='wpq'){const b3=$('#wpb3');if(b3)b3.disabled=e.target.value.trim().toUpperCase()!='CANCELLA'}if(e.target.id=='xpq')xpList();if(e.target.id=='sdq')sdFilt()},true);
document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('.sdgr [data-sg]');if(c){document.querySelectorAll('.sdgr [data-sg]').forEach(x=>x.classList.toggle('on',x==c));sdFilt();return}if(e.target.id=='cfm'){cfClose();return}if(e.target.id=='sdov'){V.sd&&(V.sd.pk=0);document.body.classList.remove('sdo-on');render()}},true);
document.addEventListener('input',e=>{const t=e.target;if(!t.classList||!t.classList.contains('ts'))return;const c=document.querySelector('.tsl[data-i="'+t.dataset.i+'"]');if(!c)return;const n=Math.min(12,Math.max(0,parseInt(t.value)||0)),bw=!!c.dataset.bw,R=[...c.querySelectorAll('.tsrow')];
 if(n>0){const ck=t.closest('.ck')&&t.closest('.ck').querySelector('.cks');if(ck&&!ck.checked)ck.checked=true}
 for(let j=R.length;j<n;j++){const p=c.querySelector('.tsrow:last-child'),x=p?{r:p.querySelector('.mxb').getAttribute('aria-pressed')=='true'?'max':parseInt(p.querySelector('.tr').value)||'',kg:p.querySelector('.tk')?parseFloat(p.querySelector('.tk').value.replace(',','.'))||0:0}:null;c.insertAdjacentHTML('beforeend',tsRow(j,x,bw))}
 R.slice(n).forEach(r=>r.remove());const cp=c.parentElement.querySelector('.tsc');if(cp)cp.hidden=n<2});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&XP)xpClose();if((e.key=='Enter'||e.key==' ')&&e.target.classList&&e.target.classList.contains('msb')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
try{new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType==1&&n.id!='xp'&&!n.closest('#xp'))xpEnh(n.matches&&n.matches(XPS)?n.parentNode:n)}))).observe(document.body,{childList:true,subtree:true})}catch(e){}
try{mpInit(S)}catch(e){}
try{const n=exMig();if(n){save();setTimeout(()=>toast('Gruppi muscolari aggiornati: '+n+' esercizi spostati da Braccia/Gambe ai nuovi gruppi'),900)}}catch(e){}
try{if(refClean())save()}catch(e){}
/* Decimali con la virgola in tutti i testi mostrati (non nei campi di inserimento; le migliaia «1.234» restano) */
const DEC=/(\d)\.(\d{1,2})(?!\d)/g;
function decFix(n){if(!n)return;if(n.nodeType==3){const v=n.nodeValue;if(v&&/\d\.\d/.test(v)){const w=v.replace(DEC,'$1,$2');if(w!=v)n.nodeValue=w}return}if(n.nodeType!=1||/^(INPUT|TEXTAREA|SCRIPT|STYLE|SELECT)$/.test(n.tagName)&&n.tagName!='SELECT')return;const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,{acceptNode:t=>t.parentElement&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(t.parentElement.tagName)?2:1});const L=[];let t;while(t=tw.nextNode())L.push(t);L.forEach(decFix)}
try{new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(decFix))).observe(document.body,{childList:true,subtree:true})}catch(e){}
render();
loadPh().then(()=>render());
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
