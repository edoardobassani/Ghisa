 if(m)h+=`<b>Micronutrienti</b> <span class="hint">(per 100 g, % del fabbisogno giornaliero di riferimento)</span>`+miL().map(([n,u,r],i)=>{const v=m[i],q=v==null?0:Math.min(100,v/r*100);return `<div class="fmi"><span>${n}</span><span class="fmb"><i style="width:${q}%"></i></span><span>${v==null?'<span class="hint">n.d.</span>':v+' '+u+' <span class="hint">'+Math.round(v/r*100)+'%</span>'}</span></div>`}).join('')+(MS[f.name]?`<p class="hint">✔ Verificato su ${esc(MS[f.name][0])}${MS[f.name][1]?' · «'+esc(MS[f.name][1])+'»':''}${MS[f.name][2]=='m'?' (alimento simile, valori approssimati)':''}. n.d. = dato non riportato dalla fonte.</p>`:`<p class="hint">Stima non verificata, inserita a mano.</p>`)+`<p class="hint">L’etichetta ha sempre la precedenza. I riferimenti sono quelli EFSA/LARN per un adulto, adattati a sesso ed età se li hai indicati in Dieta → Fabbisogno. Il sodio è un limite massimo (2000 mg), non un obiettivo. Per la vitamina D si usa 15 µg (AI).</p>`;

function wkS(d){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}
function wk(){
 const ws=[],x=new Date(wkS(today())+'T12:00:00');
 for(let i=0;i<6;i++){ws.unshift(x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()));x.setDate(x.getDate()-7)}
 const gm={};S.ex.forEach(e=>gm[e.id]=grp(e));
 const rows={};
 S.log.forEach(l=>{if(l.d<ws[0])return;const g=gm[l.e];if(!g)return;const w=wkS(l.d);if(!ws.includes(w))return;rows[g]=rows[g]||{};rows[g][w]=(rows[g][w]||0)+1});
 let h=`<h2 style="margin:18px 0 8px">Serie per gruppo a settimana</h2><p class="hint">Serie fatte per gruppo muscolare nelle ultime 6 settimane. Ogni colonna è un lunedì. L’ultima colonna è la settimana in corso; i trattini indicano i gruppi che stai trascurando.</p><div class="card">`;
 if(!Object.keys(rows).length)return h+'<p class="hint">Nessuna serie nelle ultime 6 settimane.</p></div>';
 const gs=[...groups(),...(rows['Senza gruppo']?['Senza gruppo']:[])];
 const cw=wkS(today()),lb=w=>(+w.slice(8))+'/'+(+w.slice(5,7));
 return h+`<div style="overflow-x:auto"><table class="wkt"><colgroup><col style="width:27%">${ws.map(()=>'<col>').join('')}</colgroup><tr><th></th>${ws.map(w=>`<th>${lb(w)}</th>`).join('')}</tr>`+gs.map(g=>`<tr><td>${esc(g)}</td>${ws.map(w=>{const n=(rows[g]||{})[w]||0;return n?`<td><span class="wkc" style="background:${mmCol(n)};color:${n<10?'#1c262b':'var(--card)'}">${n}</span></td>`:'<td><span class="wkc no">–</span></td>'}).join('')}</tr>`).join('')+`</table></div><div class="fleg" style="margin-top:8px"><span><i style="background:var(--hi)"></i>sotto 10</span><span><i style="background:var(--c3)"></i>10–20</span><span><i style="background:var(--acc)"></i>oltre 20</span></div></div>`;
}

function rcd(){
 const R=Math.round,e1=s=>rm1(s.kg,s.r);
 const LE=agg().le,rows=byG().flatMap(g=>g[1]).map(e=>{const s=LE[e.id]||[];if(!s.length)return null;if(e.t=='bw'){const m=s.reduce((a,b)=>(+b.r||0)>(+a.r||0)||((+b.r||0)==(+a.r||0)&&b.d>a.d)?b:a);return{n:e.name,m,bw:1}}const m=s.reduce((a,b)=>b.kg>a.kg||(b.kg==a.kg&&b.d>a.d)?b:a),r=s.reduce((a,b)=>e1(b)>e1(a)?b:a);return{n:e.name,m,rm:R(e1(r)*10)/10}}).filter(Boolean);
 let h=`<h2 style="margin:18px 0 8px">Record personali</h2><div class="card">`;
 if(!rows.length)return h+'<p class="hint">Registra qualche serie e qui troverai i tuoi massimali.</p></div>';
 return h+`<table><tr><th>Esercizio</th><th>Massimale</th><th>1RM stimato</th></tr>`+rows.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.bw?`${x.m.r} ripetizioni${x.m.f?' (max)':''}`:`${nI(x.m.kg)} kg × ${rS(x.m)}`}<br><span class="hint" style="margin:0">${fd(x.m.d)}/${x.m.d.slice(2,4)}</span></td><td>${x.bw?'<span class="hint" style="margin:0">corpo libero</span>':nI(x.rm)+' kg'}</td></tr>`).join('')+'</table><p class="hint">Per gli esercizi a corpo libero il record è il numero di ripetizioni. ⓘ 1RM stimato con la formula di Epley (1985); oltre 10 ripetizioni è la media con Brzycki (1993), perché la stima diventa meno affidabile.</p></div>';
}

function msh(){if(!S.ms.length)return '';return `<details id="dMs" ${V.o.dMs?'open':''}><summary>Storico misure (${S.ms.length})</summary>`+[...S.ms].sort((a,b)=>a.d<b.d?1:-1).map(m=>`<div class="set"><span>${fd(m.d)}/${m.d.slice(2,4)} <span class="hint">${MK.filter(([k])=>m.v[k]).map(([k,l])=>l+' '+m.v[k]).join(' · ')}</span></span><button class="x" data-a="msx" data-i="${m.id}" aria-label="Elimina">×</button></div>`).join('')+'</details>'}

function av7(){
 const end=new Date(V.nd+'T12:00:00'),ds=[];
 for(let i=0;i<7;i++){const x=new Date(end);x.setDate(x.getDate()-i);ds.push(x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()))}
 const act=ds.filter(d=>S.meal.some(m=>m.d==d));
 let h=`<div class="card">`;
 if(!act.length)return h+'<p class="hint">Nessun pasto registrato negli ultimi 7 giorni.</p></div>';
 const T={k:0,p:0,c:0,g:0};S.meal.filter(m=>act.includes(m.d)).forEach(m=>{const l=ln(m);T.k+=l.k;T.p+=l.p;T.c+=l.c;T.g+=l.g});
 const n=act.length,R=Math.round;
 return h+`<h2>${R(T.k/n)} kcal${S.goal?` <span class="hint">/ ${S.goal}</span>`:''}</h2><p class="hint">Media sui ${n} giorni con pasti registrati, fino al ${fd(V.nd)}.</p>${(G=>mb('Proteine',T.p/n,G.p,G.a.p)+mb('Carboidrati',T.c/n,G.c,G.a.c)+mb('Grassi',T.g/n,G.f,G.a.f))(gmEff())}</div>`;
}

function grMark(root,q){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];while(w.nextNode())L.push(w.currentNode);
 L.forEach(t=>{if(t.parentElement.closest('[hidden]'))return;const s=t.nodeValue,n=s.split('').map(c=>nrm(c)[0]||c).join(''),ix=[];let p=n.indexOf(q);while(p>=0){ix.push(p);p=n.indexOf(q,p+q.length)}if(!ix.length)return;
  const f=document.createDocumentFragment();let c=0;ix.forEach(i=>{f.append(s.slice(c,i));const m=document.createElement('mark');m.textContent=s.slice(i,i+q.length);f.append(m);c=i+q.length});f.append(s.slice(c));t.replaceWith(f)})}
function grFilter(){const q=nrm((V.grq||'').trim()),ds=[...document.querySelectorAll('#v details[id^="gr_"]')];let n=0;
 ds.forEach(d=>{const gd=d.querySelector('.gd');if(!gd)return;if(!gd._o)gd._o=gd.innerHTML;gd.innerHTML=gd._o;
  const items=[...gd.children].flatMap(c=>c.tagName=='UL'||c.tagName=='OL'?[...c.children]:[c]);items.forEach(i=>i.hidden=false);
  if(!q){d.hidden=false;d.open=!!V.o[d.id];return}
  const tm=nrm(d.querySelector('summary').textContent).includes(q);let hit=0;
  items.forEach(i=>{const m=nrm(i.textContent).includes(q);if(!tm)i.hidden=!m;if(m)hit++});
  const show=tm||hit>0;d.hidden=!show;if(show){d.open=true;n+=tm&&!hit?1:hit;grMark(gd,q)}else d.open=false});
 const e=$('#grn');if(e)e.textContent=q?(n?n+(n==1?' risultato':' risultati'):'Nessun risultato'):''}

 GR('start','Primi passi',`<p>Ghisa tiene traccia di allenamento, alimentazione e peso. Un buon ordine per iniziare:</p><ul><li><b>Esercizi</b>: tocca “Aggiungi esercizi base” oppure crea i tuoi, assegnando a ciascuno un gruppo muscolare.</li><li><b>Schede</b>: crea una scheda scegliendo gli esercizi e, se vuoi, le serie e le ripetizioni obiettivo.</li><li><b>Palestra</b>: scegli la scheda e registra le serie.</li><li><b>Dieta</b> e <b>Peso</b>: imposta gli obiettivi e inserisci pasti e misurazioni.</li></ul><p>La barra in basso passa da una sezione all’altra. Il pulsante “?” in alto a destra riapre questa guida.</p>`)+
 GR('oggi','Home',`<p>È la schermata iniziale e mostra a colpo d’occhio:</p><ul><li><b>Oggi</b>: l’allenamento in programma (▶ Inizia, oppure Riprendi se c’è una seduta in corso), il cardio di oggi (Registra o Apri) e i pasti del piano, con un tocco per segnarli nel diario.</li><li><b>Questa settimana</b>: sette cerchi, uno per giorno, con la scheda prevista dal programma. ✓ allenamento fatto, tratteggio giorno saltato, puntino verde se hai fatto cardio.</li><li><b>Settimane di fila</b> con il programma rispettato (quando fai almeno tanti allenamenti quanti i giorni del programma; senza programma basta un allenamento), con le ultime otto settimane in barre.</li><li><b>Oggi a tavola</b>: anello delle calorie e anelli di proteine, carboidrati e grassi rispetto agli obiettivi.</li><li><b>Riepilogo settimanale</b>: allenamenti, volume, record, cardio, kcal medie e peso con il mini grafico degli ultimi pesi. Con «Scorsa» e «Altre» guardi le settimane passate.</li></ul><p>Altro nella Home:</p><ul><li><b>Storico giorni</b>: un calendario del mese con i pallini di cosa hai fatto (blu palestra, verde cardio, giallo pasti). Tocca un giorno per il riassunto e aprilo in Palestra, Dieta o Cardio per aggiungere o correggere dati dimenticati; con ‹ › cambi mese.</li></ul>`)+
 GR('allena','Palestra',`<ul><li><b>Superserie</b>: nel riquadro «Superserie» scegli due o tre esercizi e tocca Abbina. Registri una serie per ciascuno con un solo pulsante e il recupero parte una volta sola.</li><li>In alto scegli l’<b>obiettivo settimanale</b> di allenamenti: la barra mostra quanti giorni ti sei allenato questa settimana (da lunedì). Lo stesso obiettivo conta per la striscia in Home.</li><li>Scegli la <b>data</b> e la <b>scheda</b> (oppure “Tutti gli esercizi”).</li><li>Per ogni esercizio inserisci i kg e le ripetizioni e tocca <b>Aggiungi</b>. I tasti − e + cambiano il carico di 1,25 kg.</li><li>Sotto l’esercizio vedi l’ultima sessione, il tuo record e, quando c’è, “Prova X kg”: compare se l’ultima volta hai completato tutte le serie e le ripetizioni obiettivo della scheda.</li><li>Il 🏆 segna le serie che eguagliano o superano il tuo massimo, e un avviso ti dice quando batti un record.</li><li>Il campo <b>Nota</b> serve per RPE, sensazioni o dolori e resta accanto alla serie.</li><li><b>Timer di recupero</b>: scegli la durata in alto. Parte quando aggiungi una serie e, a fine tempo, suona e vibra se il dispositivo lo permette.</li><li><b>Ripeti l’ultima seduta</b> (anche dalla Home) copia sulla data scelta le serie dell’ultimo allenamento della scheda, saltando gli esercizi che hanno già serie.</li><li>Per eliminare una serie tocca ×.</li></ul>`)+
 GR('seduta','Modalità seduta',`<p><b>Timer di recupero</b>: dopo ogni serie compare un cerchio in basso a sinistra con il tempo che manca. Toccalo per −15 s, +15 s, Riparti o ✕; tienilo premuto e trascinalo per spostarlo (la posizione viene ricordata). A fine recupero diventa verde con «VAI» e il telefono vibra.</p><p><b>Concludi sessione</b> (in alto a destra) chiude la seduta in qualsiasi momento: tocca una volta e poi «Conferma: concludi». Vedi il riepilogo (durata, serie, volume, record) e tocca Fine. Le serie sono salvate nello storico appena le aggiungi; la conclusione registra anche la seduta con la sua durata.</p><ul><li><b>Superserie</b>: se la scheda ne prevede una, i due esercizi compaiono sulla stessa schermata. Puoi anche abbinarne uno al volo dal riquadro «Superserie» sotto l’esercizio.</li><li>Tocca <b>▶ Modalità seduta</b> nella Home (scheda del giorno) o in Palestra: si apre una schermata a tutto schermo pensata per usarla in palestra, con il display che resta acceso se il telefono lo consente.</li><li>Vedi <b>un esercizio alla volta</b>, con obiettivo, ultima volta, record e le serie già fatte. Carico e ripetizioni sono precompilati e si cambiano con i tasti grandi − e + (1,25 kg e 1 ripetizione). “Aggiungi serie” registra e fa partire il timer di recupero.</li><li>Il menu a tendina in alto, con gli esercizi raggruppati per gruppo muscolare, permette di passare a un altro esercizio (con ✓ quelli già iniziati). Precedente e Successivo seguono lo stesso ordine per gruppo. In basso: <b>Precedente</b> e <b>Successivo</b>; all’ultimo esercizio compare <b>Termina seduta</b>.</li><li>Il riepilogo mostra durata, serie, esercizi, volume ed eventuali record. <b>Esci</b> chiude senza riepilogo: le serie restano comunque salvate.</li></ul>`)+
 GR('schede','Schede',`<p><b>MAX (cedimento)</b>: accanto alle ripetizioni c’è il tasto MAX. Nella scheda imposta come obiettivo «fino a cedimento» (es. 3×max); in Palestra, nelle superserie e nella modalità seduta segna la serie come portata a cedimento, e si attiva da solo quando l’obiettivo della scheda è max. Puoi scrivere anche quante ripetizioni hai fatto (es. «12 (max)»): servono per volume e grafici; senza numero la serie compare come «max» e non conta nel volume.</p><ul><li>Tocca un esercizio della scheda per aprirlo e scrivi il numero di <b>serie</b>: compare una riga per serie con <b>ripetizioni</b> (o MAX) e <b>carico</b> (kg), così puoi fare piramidi o serie diverse. Le righe nuove copiano la precedente; «Copia la prima serie in tutte» le rende uguali.</li><li>In Palestra e in Modalità seduta le serie previste sono in colonna: quella da fare è evidenziata con i campi già pronti; tocca «✓ Serie N fatta» (correggi prima i numeri se serve).</li><li><b>Superserie</b>: tra due esercizi vicini tocca «🔗 Collega in superserie» (fino a 3 esercizi). Vengono eseguiti insieme, una serie dell’uno e una dell’altro, con un solo recupero; «Scollega» li separa.</li><li>Dai un nome alla scheda, tocca «＋ Aggiungi esercizi» (cerca o filtra per gruppo, spunta quelli che vuoi; se manca puoi crearlo lì), riordinali con ▲▼ e indica serie e ripetizioni obiettivo e, se vuoi, il tempo di <b>recupero</b> in secondi (“rec s”). Di base è 120 secondi. Quel tempo vale per quell’esercizio e ha la precedenza sul timer generale; se svuoti il campo si usa il timer generale.</li><li>Le schede create stanno in <b>Schede preparate</b>. Da lì puoi usarle nell’allenamento, modificarle o eliminarle (tocca ×).</li><li><b>Programma settimanale</b>: assegna una scheda a ogni giorno, o lascia “Riposo / libero”.</li></ul>`)+
 GR('esercizi','Esercizi',`<p><b>Tipo di esercizio</b>: quando crei un esercizio, dopo il gruppo muscolare scegli <b>con sovraccarico</b> (il record è il peso caricato) o <b>a corpo libero</b> (il record è il numero di ripetizioni). Per gli esercizi già creati il tipo si cambia nell’elenco. Se fai trazioni o dip anche zavorrati, crea due esercizi, per esempio «Trazioni» a corpo libero e «Trazioni zavorrate» con sovraccarico. Negli esercizi a corpo libero il campo del carico non compare.</p><ul><li>Aggiungi un esercizio scrivendo il nome e un gruppo: puoi sceglierne uno proposto (Petto, Schiena, Spalle, Braccia, Gambe, Core) o inventare il tuo.</li><li>Nell’elenco gli esercizi sono divisi per gruppo. Da lì cambi il gruppo di un esercizio o lo elimini: l’eliminazione cancella anche tutte le sue serie.</li><li>In fondo trovi il <b>Backup</b> (vedi “Dati e backup”).</li></ul>`)+
 GR('grafici','Grafici',`<ul><li><b>Mappa muscolare</b>: quante serie fai per gruppo muscolare, a scelta come radar (con il confronto sulla media delle 4 settimane prima) o come silhouette. Tra 10 e 20 serie a settimana è l’intervallo indicato per crescere.</li><li><b>Per esercizio</b>: carico massimo, 1RM stimato o volume, con la data sull’asse orizzontale.</li><li><b>Volume totale</b>: somma di carico × ripetizioni, per tutti i gruppi o per uno solo.</li><li><b>Peso</b>, <b>media a 7 giorni</b> e <b>BMI</b>. Se hai impostato un peso obiettivo, compare come linea tratteggiata.</li><li><b>Serie per gruppo a settimana</b>: una tabella delle ultime 6 settimane. I trattini mostrano i gruppi che stai trascurando.</li><li><b>Misure corporee</b>: andamento di vita, petto, braccio, coscia, fianchi e polpaccio.</li><li><b>Record personali</b>: massimale e 1RM stimato di ogni esercizio.</li></ul><p>L’1RM è una stima (Epley; oltre 10 ripetizioni media con Brzycki), non un massimale testato.</p>`)+
 GR('dieta','Dieta',`<ul><li>In alto scegli la <b>data</b> del diario, anche con le frecce ‹ › per il giorno prima o dopo.</li><li>Il menu <b>Obiettivi</b> ha tre passi: <b>1</b> il tuo fabbisogno (sesso, età, attività; stima dalla formula di Mifflin-St Jeor e, quando ci sono abbastanza dati, dai tuoi pesi e pasti), <b>2</b> l’obiettivo calorico (Dimagrire, Mantenere, Aumentare o un tuo valore), <b>3</b> i macro in grammi. Le barre del riepilogo mostrano quanto manca e diventano rosse se superi l’obiettivo.</li><li><b>Aggiungere un alimento</b>: cerca per nome oppure apri una categoria (Proteine, Carboidrati, Grassi, Verdure, Bevande), tocca l’alimento, indica i grammi (o scegli una porzione, quando c’è) e il pasto, poi “Aggiungi al diario”. Gli alimenti usati di recente compaiono come scorciatoie.</li><li>“Copia i pasti del giorno prima” duplica il diario di ieri sulla data scelta.</li><li><b>Pasti salvati</b>: in ogni pasto del diario scrivi un nome e tocca Salva. Poi puoi riaggiungerlo con un tocco, modificarlo (nome, grammi, alimenti da togliere) o eliminarlo.</li><li><b>Alimenti personalizzati</b>: aggiungi i tuoi valori per 100 g e, se vuoi, scegli la categoria. Quelli creati compaiono nell’elenco di «Aggiungi pasto» con l’etichetta «personalizzato»: tocca ▾ per modificarli o eliminarli.</li><li>Il riepilogo mostra anche fibre e zuccheri, calcolati solo per gli alimenti che hanno questi dati: è una stima.</li><li>Più in basso trovi le calorie giornaliere nel tempo e la <b>media degli ultimi 7 giorni</b> rispetto ai tuoi obiettivi.</li><li><b>Ricette</b>: nel menu «Ricette» scegli gli ingredienti con il peso a crudo e scrivi il peso finale dopo la cottura (e, se vuoi, il peso di una porzione): l’app calcola i valori per 100 g e salva il piatto come alimento. Nella lista della spesa le ricette si scompongono negli ingredienti.</li><li><b>Copia un pasto</b>: in «Aggiungi pasto» tocca «Copia un pasto da un altro giorno», scegli giorno e pasto e copiali nel pasto selezionato.</li><li><b>Suggerimenti</b>: in «Aggiungi pasto» compaiono gli alimenti che mangi di solito in quel pasto (negli ultimi 30 giorni, almeno due volte), con la dose abituale. Un tocco aggiunge l’alimento; «Aggiungi tutto» registra il pasto tipico. All’apertura il pasto proposto segue l’ora del giorno.</li><li><b>Ricetta da testo</b>: nel menu «Ricette» tocca «+ Da testo o voce», incolla l’elenco degli ingredienti (es. «320 g pasta», «2 cucchiai di olio») e tocca «Riconosci». Le righe con ✓ sono riconosciute, quelle con ? o ✕ vanno controllate: scegli l’alimento dal menu o cercane un altro, e correggi i grammi. Cucchiai, tazze, fette e unità (es. «2 uova») vengono convertiti in grammi con valori medi. Indica le porzioni e salva, oppure apri la ricetta nell’editor. Con <b>🎤 Detta gli ingredienti</b> puoi elencarli a voce (es. «trecento grammi di pasta, una scatoletta di tonno, due cucchiai di olio»), poi tocca Fine: le righe vengono aggiunte al riquadro e riconosciute. La dettatura usa il riconoscimento vocale gratuito del browser (Chrome), serve il permesso del microfono e di solito la connessione; nell’anteprima di Claude non funziona.</li><li><b>Micronutrienti del giorno</b>: fibre, minerali e vitamine del diario in percentuale degli obiettivi LARN (sesso ed età dal Fabbisogno giornaliero). Sodio e zuccheri sono limiti. Sotto «Per completare» trovi alimenti, prima tra quelli che mangi già, che coprono ciò che manca: un tocco li aggiunge al pasto scelto.</li></ul><p>Tutti i menu della Dieta si aprono chiusi (tranne il tasto per scansionare il codice a barre, sempre in alto): tocca un titolo per aprirlo. Restano aperti finché non chiudi l’app. Il titolo di alcuni menu mostra già il dato principale (calorie del giorno, numero di alimenti).</p><p>I valori del database sono medi e indicativi: per i prodotti confezionati vale l’etichetta.</p>`)+
 GR('extra','Novità: tasto +, tema, riepilogo',`<ul><li>Il tasto <b>+</b> in basso a destra apre l’aggiunta rapida: peso di oggi, serie, seduta, pasto, cardio.</li><li>Se chiudi o ricarichi la pagina durante una <b>seduta</b>, al ritorno riprende da dove eri (entro 12 ore).</li><li>Il <b>tema</b> (Auto, Chiaro, Scuro) si sceglie nel menu laterale.</li><li>Il <b>riepilogo settimanale</b> in Home mostra allenamenti, volume, record, cardio, kcal medie e peso, per la settimana corrente o la scorsa.</li></ul>`)+
 GR('piano','Piano pasti e spesa',`<ul><li><b>Settimane</b>: con ‹ › in alto passi da una settimana all’altra. Una settimana senza piano proprio usa quello dell’ultima settimana pianificata; se la modifichi, la modifica vale da lì in poi solo per quella settimana. «⧉ Copia questa settimana nelle prossime» la copia nelle settimane che scegli.</li><li><b>⧉ Copia pasto</b> (sul titolo di ogni pasto): copia quel pasto negli altri giorni, sostituendo o aggiungendo.</li><li>Nella tab <b>Piano pasti</b> scegli un giorno della settimana e componi i quattro pasti con un <b>preferito</b> (anche ×0,5, ×1,5, ×2) o con un <b>alimento</b> in grammi. Con <b>🎤 + Da testo o voce</b> scrivi o detti più alimenti in una volta (es. «80 g fiocchi d’avena, una banana, 200 ml di latte»): l’app li riconosce come nelle ricette, controlli le righe con ? o ✕ e tocchi «Aggiungi». Vedi subito calorie e macro contro i tuoi obiettivi.</li><li><b>Copia in altri giorni</b> ripete un giorno su quelli che scegli. <b>Applica al diario</b> aggiunge i pasti al giorno corrispondente della settimana in corso.</li><li><b>Spesa</b>: somma gli alimenti di tutta la settimana o dei giorni scelti, divisi per categoria. Riso e pasta cotti sono convertiti in peso a crudo. Spunta quello che hai comprato; «Copia come testo» ti dà la lista da incollare.</li></ul>`)+
 GR('barcode','Codice a barre',`<ul><li>In <b>Dieta → Aggiungi pasto</b> tocca «Scansiona codice a barre» e inquadra il prodotto: se il codice è già tra i tuoi alimenti lo trovo subito, altrimenti lo cerco su <b>Open Food Facts</b> (serve internet) e ti mostro nome e valori per 100 g da controllare.</li><li>Se il prodotto non c’è o sei offline, scrivi i valori dall’etichetta: li collego al codice e dalla volta dopo basta scansionare, anche <b>senza rete</b>.</li><li>La lettura dalla fotocamera funziona solo nell’<b>app installata</b> (Chrome su Android); nell’anteprima dentro Claude puoi scrivere le cifre a mano. In alternativa scrivi il codice nella casella.</li><li>I valori di Open Food Facts li inseriscono gli utenti: confrontali con l’etichetta. Se calorie e macro non tornano ti avviso.</li><li>Dati © contributori di Open Food Facts, licenza ODbL (openfoodfacts.org).</li></ul>`)+
 GR('cardio','Cardio',`<ul><li>Gli <b>obiettivi macro</b> in Dieta si stimano da soli (peso, stile di vita scelto nel Fabbisogno e calorie); scrivendo un tuo valore lo sostituisci, svuotando il campo torna l’automatico.</li><li>Nell’elenco alimenti il tasto <b>▾</b> mostra il rapporto tra i macro e i micronutrienti (sodio, potassio, calcio, magnesio, ferro, zinco, vitamine C, B12 e D) per 100 g. Per ${Object.keys(MS).length} alimenti su 210 sono verificati su tabelle USDA o INRAN (la fonte è indicata nel pannello); gli altri sono stime non verificate. “n.d.” = dato non riportato dalla fonte.</li><li>In <b>Dieta</b> ogni alimento di un pasto ha il tasto <b>Modifica</b> (grammi e pasto) e ogni pasto ha “+ Aggiungi alimento”.</li><li>I <b>grafici</b> si aprono sugli ultimi 3 mesi; con 1M, 3M, 6M, Tutto o lo zoom cambi la vista.</li><li>Le <b>kcal</b> si calcolano da sole (attività, durata, distanza e peso); se hai un dato più preciso scrivilo nel campo e sostituisce la stima. Le stime nello storico hanno il simbolo ~.</li><li>Nello <b>Storico</b> tocca <b>Modifica</b> per cambiare data, attività, durata, km, kcal o note di una sessione.</li><li>In alto scegli l’<b>obiettivo settimanale</b> di sessioni cardio: la barra segue le sessioni di questa settimana e il dato compare anche in Home.</li><li>Nella tab <b>Cardio</b> scegli data e attività (corsa, camminata, bici…) e inserisci i minuti; distanza, calorie e note sono facoltative.</li><li>Se indichi sia minuti sia km l’app calcola il <b>ritmo</b> (minuti al km).</li><li>In alto vedi il riepilogo della settimana (da lunedì). I grafici (minuti o km per giorno, filtrabili per attività, e minuti a settimana) sono in Grafici › Cardio: il tasto «Vedi i grafici del cardio» ti porta lì.</li><li>Le sessioni di oggi compaiono anche nella Home. Per eliminarne una tocca ×.</li></ul>`)+
 GR('obm','Obiettivi e misure',`<p>Raccoglie in un posto i dati di peso, misure e obiettivi: peso e altezza con peso obiettivo, misure corporee, massa grassa stimata, obiettivo settimanale di palestra e di cardio, obiettivi di calorie e macro e fabbisogno giornaliero.</p><p>Non sostituisce le altre sezioni: usa gli stessi dati. Un peso salvato qui compare in Corpo e nei Grafici, un obiettivo cambiato qui si vede in Palestra, Cardio o Dieta, e viceversa.</p><p>I menu si aprono chiusi; il titolo mostra già il valore principale.</p>`)+
 GR('peso','Peso e misure',`<ul><li><b>Massa grassa</b>: serve l’altezza, il sesso (si imposta lì stesso) e le misure di <b>collo</b> e <b>vita</b> (per le donne anche i <b>fianchi</b>), in cm. L’app usa la formula della Marina USA: l’errore tipico è di 3–4 punti percentuali, quindi guarda soprattutto l’andamento nel tempo.</li><li>Inserisci l’altezza e, se vuoi, un peso obiettivo. Poi registra le misurazioni: se ne salvi due nello stesso giorno vale l’ultima.</li><li>Il <b>BMI</b> è calcolato dall’app (peso diviso altezza al quadrato). È un valore indicativo: non distingue massa muscolare e grasso.</li><li><b>Misure corporee</b>: scegli la data, compila quelle che vuoi (anche solo una) e salva. Se riusi la stessa data, le misure si aggiungono a quelle già presenti.</li></ul>`)+
 GR('menu','Menu e ricerca',`<ul><li>Il menu delle sezioni si apre con ☰ in alto a sinistra oppure <b>strisciando dal bordo sinistro</b> dello schermo verso destra (sui dispositivi touch). Per chiuderlo striscia verso sinistra o tocca fuori.</li><li>In cima al menu c’è la <b>ricerca</b>: scrivi il nome di un esercizio, di una scheda, di un alimento o di una sezione. Un esercizio apre i suoi grafici, una scheda apre Schede, un alimento apre Dieta già selezionato.</li><li><b>Riordinare i menu</b>: in ogni sezione tocca ⚙ accanto al titolo e conferma «Sì, sposta ordine». Sopra ogni menu compare una barra con la maniglia ⠿: tienila premuta e trascina; i contenuti restano visibili ma non rispondono ai tocchi. Tocca Fine per terminare: l’ordine resta salvato.</li><li><b>Ordine delle sezioni nel menu</b>: apri ☰, tocca «⚙ Riordina sezioni», conferma e trascina ⠿ di ogni voce. Tocca Fine per salvare.</li></ul>`)+
 GR('foto','Foto di progresso',`<ul><li>Nella tab <b>Corpo</b>, sezione “Foto di progresso”, scegli la data e la posa (Fronte, Lato, Retro), poi “Scatta o scegli foto”. La foto viene ridimensionata e salvata solo su questo dispositivo.</li><li>Per confronti utili usa sempre la stessa posa, la stessa luce e la stessa ora del giorno.</li><li><b>Promemoria mensile</b>: dal primo lunedì del mese, finché non salvi una foto, compare un avviso nella Home e un puntino accanto a “Corpo”. “Salta questo mese” lo nasconde fino al mese dopo. Il promemoria compare solo quando apri l’app.</li><li><b>Confronto</b>: scegli due date con la stessa posa. Con <b>Cursore</b> trascini una linea sull’immagine (o usi la barra sotto) per vedere “prima” e “dopo” sovrapposte; con <b>Affiancate</b> le vedi una accanto all’altra.</li></ul>`)+
 GR('fonti','Formule e fonti',`<p>Ogni stima dell’app indica accanto la formula (simbolo ⓘ). Riepilogo:</p><ul>
<li><b>1RM stimato</b>: Epley (1985); oltre 10 ripetizioni media con Brzycki (1993).</li>
<li><b>«Prova X kg»</b>: +2–3% del carico quando completi l’obiettivo, dentro il 2–10% dell’ACSM (2009).</li>
<li><b>Serie a settimana per muscolo</b>: 10–20 (Schoenfeld e coll., 2017; Baz-Valle e coll., 2022).</li>
<li><b>Fabbisogno</b>: Mifflin-St Jeor (1990) × livello di attività (PAL, FAO/OMS/UNU 2004).</li>
<li><b>Fabbisogno dai tuoi dati</b>: bilancio energetico con 7.700 kcal per kg di peso di tendenza.</li>
<li><b>Peso di tendenza</b>: media mobile esponenziale al 10% («The Hacker’s Diet»).</li>
<li><b>Ritmo verso il peso obiettivo</b>: −0,5% a settimana (Helms e coll., 2014), +0,25% (Iraki e coll., 2019).</li>
<li><b>Macro automatici</b>: proteine 1,0–2,0 g/kg (ISSN 2017), grassi ≥25% delle kcal (LARN 20–35%), carboidrati il resto (≥3 g/kg).</li>
<li><b>Micronutrienti</b>: LARN, V revisione (SINU); sodio max 2 g, zuccheri max 15% delle kcal, fibre ≥25 g.</li>
<li><b>Kcal del cardio</b>: MET × peso × ore, MET dal Compendium of Physical Activities 2024.</li>
<li><b>Massa grassa</b>: Marina USA (Hodgdon e Beckett, 1984), fasce ACE.</li>

const DEC=/(\d)\.(\d{1,2})(?!\d)/g;
function decFix(n){if(!n)return;if(n.nodeType==3){const v=n.nodeValue;if(v&&/\d\.\d/.test(v)){const w=v.replace(DEC,'$1,$2');if(w!=v)n.nodeValue=w}return}if(n.nodeType!=1||/^(INPUT|TEXTAREA|SCRIPT|STYLE|SELECT)$/.test(n.tagName)&&n.tagName!='SELECT')return;const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,{acceptNode:t=>t.parentElement&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(t.parentElement.tagName)?2:1});const L=[];let t;while(t=tw.nextNode())L.push(t);L.forEach(decFix)}
